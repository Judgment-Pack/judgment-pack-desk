name: Toolchains from dev.json
description: >-
  Sets up node, Go and Python at the versions dev.json names, so that scripts/dev/check.sh runs
  the repository's check list with the same toolchains everywhere. The repository must be
  checked out first.

runs:
  using: composite
  steps:
    - name: Read the toolchains from dev.json
      id: dev
      shell: bash
      run: |
        set -eu
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json
        m = json.load(open("dev.json", encoding="utf-8"))
        tc = m.get("toolchains", {})
        print("node=" + tc.get("node", {}).get("version", ""))
        print("go=" + ("true" if "go" in tc else "false"))
        print("goversion=" + tc.get("go", {}).get("version", ""))
        print("python=" + tc.get("python", {}).get("version", "3.12"))
        PY
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.dev.outputs.node != ''
      with:
        node-version: ${{ steps.dev.outputs.node }}
        cache: npm
        cache-dependency-path: web/package-lock.json
    # The Go release is the manifest's (toolchains.go.version); a manifest that names none falls
    # back to the go directive of go.mod.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.dev.outputs.go == 'true' && steps.dev.outputs.goversion != ''
      with:
        go-version: ${{ steps.dev.outputs.goversion }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: steps.dev.outputs.go == 'true' && steps.dev.outputs.goversion == ''
      with:
        go-version-file: go.mod
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.dev.outputs.python }}

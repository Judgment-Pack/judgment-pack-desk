name: Release Desk
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: desk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    uses: ./.github/workflows/ci.yml
  archives:
    needs: compatibility
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ github.ref_name }}
  publish:
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: desk-release-complete
          path: ${{ runner.temp }}/release
      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if test -f "docs/releases/$RELEASE_TAG.md"; then
            cat "docs/releases/$RELEASE_TAG.md" > "$notes"
          else
            printf 'Desk %s\n' "$RELEASE_TAG" > "$notes"
          fi
          cat docs/releases/platforms.md >> "$notes"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --repo Judgment-Pack/judgment-pack-desk --verify-tag --notes-file "$notes" --latest

name: CI

# The checks are the steps of dev.json, run by scripts/dev/check.sh. A job sets up the toolchains
# dev.json names (.github/actions/toolchains) and runs the steps it owns with --only, so a
# check is defined once, in dev.json, and runs the same way on a contributor's machine.
#
# The jobs named Go and Web are the status checks branch protection on main requires (with
# DCO); keep their names. The job named check runs the whole list but go-test, so that nothing
# in dev.json is left to a job that does not exist; go-test is the Go jobs' (internal/desk in
# shards), and runs once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  component-policy:
    name: Component release policy
    runs-on: ubuntu-latest
    outputs:
      development: ${{ steps.lock.outputs.development }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - id: lock
        run: |
          scripts/dev/check.sh --only component-policy
          python3 -c 'import json; p=json.load(open("internal/releaseplan/components.json")); print("development="+str(any(c["channel"]=="development" for c in p["components"].values())).lower())' >> "$GITHUB_OUTPUT"

  development-bundle:
    name: Development build (${{ matrix.os }})
    needs: component-policy
    if: needs.component-policy.outputs.development == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      # Builds and verifies the exact development companions and starts their programs. The
      # step passes with nothing to build when the lock has no development pin.
      - run: scripts/dev/check.sh --only development-build

  # internal/desk's tests run in parallel shards (scripts/dev/go-test.sh says how a test is
  # assigned; the number of shards is its own, read here), the other packages in Go checks. The
  # job named Go is the required status check: it passes only when every Go job passed and the
  # shards together reported every test the package lists.
  go-plan:
    name: Go test shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          shards=$(scripts/dev/go-test.sh --shards)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$shards")" >> "$GITHUB_OUTPUT"

  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      # gofmt is checked, not applied: a file that is not formatted fails the step. The
      # mutation needle guards (python-tests, needle-check) check the mutation harness itself,
      # not the test suite: every row's needle matches its file once, and the harness's own
      # logic holds against stand-in suites. No mutation row runs here. The rows run in
      # mutation-rows.yml (a pull request's own) and mutation-nightly.yml, which block nothing.
      # go-test here is every package but internal/desk, whose shards are the next job.
      - run: scripts/dev/check.sh --only gofmt,component-policy,python-tests,needle-check,component-identities,go-vet,go-test
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/go-check-logs
          GO_TEST_SHARD: others
      # Only per-step command output, not workspace, credentials or caches.
      - name: Upload the go step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-check-logs/
          if-no-files-found: ignore
          retention-days: 7

  # One shard of internal/desk a job. Each shard's tests stop at 30 minutes (go test's own
  # -timeout, whose panic names the tests still running), well inside the job's limit. The
  # relay's end-to-end tests need a runtime binary and a Judgment Pack project. These jobs
  # supply neither, so they skip themselves (requireBinary and e2eFixtures in
  # internal/desk/server_test.go); go-test runs with -v so that the skips stay visible. What
  # runs with the real companions is in the check job. The shard's log, its test list and its
  # record are its artifact, named by the shard; the job summary names its failing tests.
  go-test-desk:
    name: Go test internal/desk (${{ matrix.shard }}/${{ needs.go-plan.outputs.count }})
    needs: go-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.go-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - run: scripts/dev/check.sh --only go-test
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/go-test-desk
          GO_TEST_SHARD: ${{ matrix.shard }}/${{ needs.go-plan.outputs.count }}
          GO_TEST_ARTIFACT: go-test-desk-shard-${{ matrix.shard }}-of-${{ needs.go-plan.outputs.count }}-${{ github.run_id }}
      # A re-run replaces the shard's artifact, so the Go job reads each shard's latest run.
      - name: Upload the shard's log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-desk-shard-${{ matrix.shard }}-of-${{ needs.go-plan.outputs.count }}-${{ github.run_id }}
          path: ${{ runner.temp }}/go-test-desk/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  go:
    name: Go
    needs: [go-plan, go-checks, go-test-desk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.go-plan.result == 'success'
        with:
          pattern: go-test-desk-shard-*-of-${{ needs.go-plan.outputs.count }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
      # Every test the package lists reported a result in exactly one shard: a test no shard
      # selected, a shard that never ran, or one that stopped early fails here. The job
      # summary lists each shard's verdict, failing tests and artifact.
      - name: Every internal/desk test ran in one shard
        if: needs.go-plan.result == 'success'
        env:
          SHARDS: ${{ needs.go-plan.outputs.count }}
        run: python3 scripts/dev/go-test-shards.py complete "$SHARDS" "$RUNNER_TEMP"/shards/*/
      - name: Every Go job passed
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          failed = {job: need['result'] for job, need in json.loads(os.environ['RESULTS']).items() if need['result'] != 'success'}
          for job, result in failed.items(): print('%s: %s' % (job, result))
          sys.exit(1 if failed else 0)
          PY

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - run: scripts/dev/check.sh --setup --only npm-ci
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/web-check-logs
      # The build comes before the tests, not after: one test greps the emitted bundle for a
      # credential on a URL, which is the only place that claim can be checked over the code
      # that actually ships. dialect-read reads a Desk-produced dialect preparation with the
      # pinned dialect specification (read-only test input, never committed).
      - run: scripts/dev/check.sh --only i18n-check,ui-message-audit,typecheck,vite-build,web-tests,dialect-read
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/web-check-logs
      # Only per-step command output, not workspace, credentials or caches.
      - name: Upload the web step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-check-logs/
          if-no-files-found: ignore
          retention-days: 7

  local-gateway:
    name: Local gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - run: scripts/dev/check.sh --only local-gateway

  # The whole list of dev.json. The first step stops a broken manifest or agent doc pair before
  # the long steps; the rest run with --all, so that one failure does not hide another. The
  # steps that need the official companions, the Exchange and the Gateway fixtures run here
  # (they were the Jobs companion and Signed Exchange acquisition acceptance jobs). A step whose
  # environment variable is empty is skipped and said to be; component-freshness and
  # mutation-rows are optional because their own workflows set theirs. go-test is skipped: the
  # Go jobs run it, internal/desk in shards, which no single job's budget holds.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchains
      - name: The agent docs and the manifest
        run: scripts/dev/check.sh --only agent-docs
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      - name: Checks
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/check-logs
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$CHECK_EVENT" = pull_request ]; then
            if [ -z "$CHECK_BASE_REF" ]; then
              echo 'check: pull request base ref is empty' >&2
              exit 2
            fi
            git check-ref-format "refs/heads/$CHECK_BASE_REF" || exit 2
            git rev-parse --verify "refs/remotes/origin/$CHECK_BASE_REF^{commit}" >/dev/null || exit 2
            scripts/dev/check.sh --all --skip go-test --changed "origin/$CHECK_BASE_REF"
          else
            scripts/dev/check.sh --all --skip go-test
          fi
      # The full output of every step, which the summary block shortens.
      - name: Upload the step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: ignore
          retention-days: 7

  release-archives:
    needs: component-policy
    if: github.event_name == 'pull_request' && needs.component-policy.outputs.development == 'false'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v0.0.0
      snapshot: true

name: CI

# dev.json defines commands; scripts/dev/ci-ownership.json assigns their CI owners and
# setup dependencies. The helper runs that map and records each successful OS variant.
# Keep Go, Web and check: branch protection and release callers depend on those names.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  component-policy:
    name: Component release policy
    runs-on: ubuntu-latest
    outputs:
      development: ${{ steps.lock.outputs.development }}
    steps:
      - uses: actions/checkout@v7
      - id: lock
        run: |
          python3 scripts/dev/ci-ownership.py run --owner component-policy --evidence "$RUNNER_TEMP/ci-ownership"
          python3 -c 'import json; p=json.load(open("internal/releaseplan/components.json")); print("development="+str(any(c["channel"]=="development" for c in p["components"].values())).lower())' >> "$GITHUB_OUTPUT"

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-component-policy-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  development-bundle:
    name: Development build (${{ matrix.os }})
    needs: component-policy
    if: needs.component-policy.outputs.development == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      # Builds and verifies the exact development companions and starts their programs. The
      # step passes with nothing to build when the lock has no development pin.
      - run: python3 scripts/dev/ci-ownership.py run --owner development-bundle --variant "${{ matrix.os }}" --evidence "$RUNNER_TEMP/ci-ownership"

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-development-bundle-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      # gofmt is checked, not applied: a file that is not formatted fails the step. The
      # mutation needle guards (python-tests, needle-check) check the mutation harness itself,
      # not the test suite: every row's needle matches its file once, and the harness's own
      # logic holds against stand-in suites. No mutation row runs here. The rows run in
      # mutation-rows.yml (a pull request's own) and mutation-nightly.yml, which block nothing.
      # The relay's end-to-end tests need a runtime binary and a Judgment Pack project. This job
      # supplies neither, so they skip themselves (requireBinary and e2eFixtures in
      # internal/desk/server_test.go); go-test runs with -v so that the skips stay visible.
      # What runs with the real companions is in the integration job.
      - run: python3 scripts/dev/ci-ownership.py run --owner go --evidence "$RUNNER_TEMP/ci-ownership"
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/go-check-logs
      # Only per-step command output, not workspace, credentials or caches.
      - name: Upload the go step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-check-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-go-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      # The build comes before the tests, not after: one test greps the emitted bundle for a
      # credential on a URL, which is the only place that claim can be checked over the code
      # that actually ships. dialect-read reads a Desk-produced dialect preparation with the
      # pinned dialect specification (read-only test input, never committed).
      - run: python3 scripts/dev/ci-ownership.py run --owner web --evidence "$RUNNER_TEMP/ci-ownership"
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/web-check-logs
      # Only per-step command output, not workspace, credentials or caches.
      - name: Upload the web step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-check-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-web-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  local-gateway:
    name: Local gateway (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - run: python3 scripts/dev/ci-ownership.py run --owner local-gateway --variant "${{ matrix.os }}" --evidence "$RUNNER_TEMP/ci-ownership"

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-local-gateway-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  # Real-companion, browser-reader and certification environments retain their checks.
  # npm-ci and vite-build repeat here as isolated integration setup, without rerunning
  # the deterministic Go/Web suites. Optional external reports retain their own workflows.
  integration:
    name: Integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchains
      - name: Checks and their setup dependencies
        env:
          JPDEV_LOGDIR: ${{ runner.temp }}/check-logs
        run: python3 scripts/dev/ci-ownership.py run --owner integration --evidence "$RUNNER_TEMP/ci-ownership"
      # The full output of every step, which the summary block shortens.
      - name: Upload the step logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep same-candidate completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ownership-integration-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ownership/*.json
          if-no-files-found: error
          retention-days: 7

  release-archives:
    needs: component-policy
    if: github.event_name == 'pull_request' && needs.component-policy.outputs.development == 'false'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v0.0.0
      snapshot: true
      ci-receipt: true

  check:
    name: check
    needs: [component-policy, go, web, integration, local-gateway, development-bundle, release-archives]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read all owner completion evidence from this run
        uses: actions/download-artifact@v8
        with:
          pattern: ci-ownership-*
          path: ${{ runner.temp }}/ci-ownership
          merge-multiple: true
      - name: Require every expected job and same-candidate OS variant
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CI_NEEDS" > "$RUNNER_TEMP/ci-needs.json"
          python3 scripts/dev/ci-ownership.py aggregate --needs "$RUNNER_TEMP/ci-needs.json" --evidence "$RUNNER_TEMP/ci-ownership"

name: Policy source producer contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-consumer:
    name: Exact Gateway observation and Desk acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Desk under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/toolchains

      # scripts/dev/policy-source-contract.sh checks out the exact Gateway test fixture
      # (a synthetic contract fixture, not an official component release and not a change to
      # Desk's production component lock), builds the real canon and the focused test programs,
      # records the source and build provenance, generates the unmodified real producer
      # observation, and has the Desk's own test accept those exact bytes with the real canon.
      - name: Exact Gateway observation and Desk acceptance
        run: scripts/dev/check.sh --only policy-source-contract

      - name: Upload synthetic contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-source-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/policy-source-contract/*.json
            ${{ runner.temp }}/policy-source-contract/*.log
            ${{ runner.temp }}/policy-source-contract/observation.sha256
          if-no-files-found: ignore
          retention-days: 14

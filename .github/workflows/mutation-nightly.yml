name: Mutation rows, nightly
run-name: ${{ inputs.half && inputs.half != 'all' && format('Mutation rows, {0} only', inputs.half) || 'Mutation rows, nightly' }}

# Every row of scripts/mutation-check.sh, each against the tests that can
# notice it (issue #253). A row is decided by its selection only when a test
# in it fails; anything else runs the whole suite before it is called a
# survivor, so a selection's blind spot shows up here, on a schedule, and not
# on a PR.
#
# **This run blocks nothing.** Regular CI protects merges and releases: branch
# protection on main requires Go, Web and DCO from ci.yml, and a release
# (release.yml) runs ci.yml and release-build.yml and nothing else. This
# workflow checks the test suite's quality: it is not a required check, no
# workflow waits on it or is started by it, and a red run means a gap in the
# tests to fix (it opens a `mutation-survivor` issue), never a release to
# hold.
#
# **It runs when main changed.** The first job compares main's head with every
# completed run of this workflow on main, whatever started it: where one has
# already run every row of this commit, the scheduled run ends there, green,
# and starts no shard. A dispatch always runs.
#
# One job cannot run the list inside GitHub's six-hour limit, so the rows are
# shared out with --shard: every n-th row, from the k-th. The shards' tables
# are put back in row order in one table, published with the record each
# shard left (--record): a line that differs from the tracked
# scripts/mutation-expects.tsv is one to commit, by hand.
#
# A dispatch can run one half (`gh workflow run mutation-nightly.yml -f
# half=web`), and on any branch (`--ref`): one run at a time per branch, so a
# branch's run does not wait for main's. Only a run on main opens, updates or
# closes the survivor issue.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      half:
        description: The rows to run
        type: choice
        options: [all, go, web]
        default: all

permissions:
  contents: read

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed:
    name: Has main changed since the last run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # A completed run counts where it ran every row (a dispatch of one half
      # is titled "… only") and was not cancelled: a run cancelled in the
      # queue checked nothing. Where the list cannot be read, the rows run.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          done_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-nightly.yml/runs?branch=main&status=completed&head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure") | select(.display_title | endswith(" only") | not)] | length' || echo unknown)"
          case "$done_before" in
            0) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            unknown) echo "the earlier runs could not be read: running every row" | tee -a "$GITHUB_STEP_SUMMARY"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "main is still ${SHA:0:7}, which an earlier run of this workflow already checked: nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

  rows:
    name: ${{ matrix.half }} rows, shard ${{ matrix.k }}/${{ matrix.half == 'go' && '4' || '6' }}
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # Four Go shards and six web ones; a dispatch that names one half
      # leaves the other out.
      matrix:
        half: [go, web]
        k: [1, 2, 3, 4, 5, 6]
        exclude:
          - { half: go, k: 5 }
          - { half: go, k: 6 }
          - half: ${{ inputs.half == 'go' && 'web' || inputs.half == 'web' && 'go' || 'neither' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        if: matrix.half == 'go'
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        if: matrix.half == 'web'
        with:
          node-version: 22

      - name: npm ci
        if: matrix.half == 'web'
        run: npm --prefix web ci

      # The web suite reads the bundle (src/testing/bundle.test.ts), so it is
      # built first, as CI's own web job does.
      - name: vite build
        if: matrix.half == 'web'
        working-directory: web
        run: npx vite build

      # The step's own limit sits inside the job's, so a shard that runs out
      # of time still publishes the rows it finished: --record writes each
      # row's line as the row ends. The progress lines go to the job's log as
      # they come, as well as to the shard's progress.log.
      - name: Run the shard's rows
        timeout-minutes: 330
        env:
          HALF: ${{ matrix.half }}
          SHARD: ${{ matrix.k }}/${{ matrix.half == 'go' && '4' || '6' }}
        run: |
          # The shard fails with the harness, not with tee.
          set -o pipefail
          out="$RUNNER_TEMP/shard"
          mkdir -p "$out"
          echo "$HALF ${SHARD%/*} ${SHARD#*/}" > "$out/shard.txt"
          { bash scripts/mutation-check.sh "$HALF" --shard "$SHARD" --record 2>&1 1>&3 3>&- | tee "$out/progress.log" >&2; } 3> "$out/table.md"

      - name: Keep the record this shard left
        if: always()
        run: cp scripts/mutation-expects.tsv "$RUNNER_TEMP/shard/"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: error
          retention-days: 14

  table:
    name: One table
    needs: [changed, rows]
    if: always() && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*
          path: ${{ runner.temp }}/shards

      - name: Put the shards back together
        env:
          HALF: ${{ inputs.half || 'all' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/mutation-nightly-table.py "$RUNNER_TEMP/shards" "$RUNNER_TEMP/table" \
            --half "$HALF" --run-url "$RUN_URL" --date "$(date -u +%F)"
          cat "$RUNNER_TEMP/table/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # One open `mutation-survivor` issue at a time: a run with a survivor or
      # an INCONCLUSIVE row opens it, or comments on it; a run of every row
      # that caught every row closes it. Runs on other branches leave it be.
      - name: Open, update or close the survivor issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          t="$RUNNER_TEMP/table"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label mutation-survivor --state open --json number --jq '.[0].number // empty')"
          if [ -f "$t/issue.md" ] && [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$t/issue.md"
          elif [ -f "$t/issue.md" ]; then
            gh label create mutation-survivor --repo "$GITHUB_REPOSITORY" --color B60205 \
              --description "A mutation row the test suite did not catch: a test-suite gap, never a release blocker" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$(cat "$t/issue-title.txt")" --label mutation-survivor --body-file "$t/issue.md"
          elif [ "$(cat "$t/clean")" = true ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Run $RUN_URL ran every row and caught every one: closing."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-table
          path: |
            ${{ runner.temp }}/table/table.md
            ${{ runner.temp }}/table/mutation-expects.tsv
          if-no-files-found: error
          retention-days: 30
